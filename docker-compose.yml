services:
  postgres:
    image: postgres:16-alpine
    container_name: flashlock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flashlock
      POSTGRES_USER: flashlock
      POSTGRES_PASSWORD: flashlock_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashlock -d flashlock"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flashlock-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "flashlock_redis_secret"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "flashlock_redis_secret", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
